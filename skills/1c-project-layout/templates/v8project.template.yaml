# Контракт v8-runner/unica (формат — references/tooling/v8project.md плагина
# unica). Машинные адреса, платформа и креды — в v8project.local.yaml.
# Ключи execution_timeout и push.partialLoadThreshold НЕ использовать:
# v8-runner 0.14 (unica rc.7+) отвергает их как invalid_source (общего
# дедлайна и порога частичной загрузки больше нет — per-step в раннере).
workPath: 'build'
format: DESIGNER
infobases:
  origin:
    connection: '{ib_connection}'
source-set:
  - name: main
    type: CONFIGURATION
    path: src/cf
  # каждое расширение — отдельный source-set:
  # - name: <ИмяРасширения>
  #   type: EXTENSION
  #   path: src/cfe/<ИмяРасширения>
