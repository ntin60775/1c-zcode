# Контракт v8-runner/unica 0.15 (формат — references/tooling/v8project.md
# плагина unica). Общая часть проекта; машинные адреса, платформа и креды —
# в v8project.local.yaml.
#
# Не использовать: builder, basePath, execution_timeout,
# push.partialLoadThreshold, верхнеуровневый connection. v8-runner 0.15
# отвергает их как invalid_source. Полная загрузка — push full:true.
# Привязка инфобазы — только в local-слое: infobases.origin.
workPath: 'build'
format: DESIGNER
source-set:
  - name: main
    type: CONFIGURATION
    path: src/cf
  # каждое расширение — отдельный source-set:
  # - name: <ИмяРасширения>
  #   type: EXTENSION
  #   path: src/cfe/<ИмяРасширения>
