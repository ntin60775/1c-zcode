# Локальный оверлей машины: в git не попадает.
# Файловая база на Linux — мутации через ibcmd (headless): пакетный
# конфигуратор падает по GTK в Wayland-сессии (разовый обход:
# env -u WAYLAND_DISPLAY GDK_BACKEND=x11). 0.15: per-operation providers,
# ключ builder не используется.
infobases:
  origin:
    connection: '{ib_connection}'   # БЕЗ user/password внутри строки
    # user: <пользователь ИБ>       # пароль — не в git, не в чат
    # password: <через env или этот файл, но не в общий v8project.yaml>
providers:
  push: ibcmd
  extensions: ibcmd
tools:
  platform:
    path: '/opt/1cv8/x86_64/<версия>'   # каталог установки, БЕЗ strict-пина:
                                        # строгая проверка версии ломается
                                        # на установке без версии в пути
# Тест-дерево: файл .zcode/contour со словом test (прод по умолчанию,
# fail-closed; см. навык 1c-contour). Ключ `contour:` в ЭТОМ файле писать
# нельзя: v8-runner 0.15 отвергает незнакомый верхнеуровневый ключ
# local-слоя (`bad_value`) и любая unica.run-операция падает.
