# Профили тестовых баз 1c-testpilot (контуры 1c-zcode).
# Копия лежит в .zcode/testpilot/profiles.yaml — машинно-локальный файл ВНЕ
# git (.gitignore контура), поэтому пароль здесь хранится как значение поля
# password. Так решил владелец (27.10): переменной окружения не будет.
# 1c-testpilot принимает password ИЛИ password_env (имя env-переменной) —
# канон контура: password; password_env оставлен апстримом для старых
# раскладок, в новых профилях не используется.
# Формат — profiles.yaml 1c-testpilot 1.9.x: профили ОБЯЗАНЫ жить под
# корневым ключом profiles: (плоский корень = ActionError при запуске).
# Перечитывается на каждом обращении — правка не требует перезапуска.
# Относительный base резолвится от каталога ЭТОГО файла.
# wait: 300 — первый старт тест-клиента под Xvfb (software-GL) занимает
# минуты; на пилоте 240 выпало впритык (запуск на грани) — запас обязателен.
profiles:
  main:
    base: ../../../build/ib    # от каталога этого файла; файловая база
    # server: true             # серверная база: base: MyBase, server: true
    user: Тестировщик
    password: ''               # пароль пользователя; файл вне git
    # exe: /opt/1cv8/x86_64/8.3.27/1cv8
    # version: 8.3.27
    desktop: isolated          # изолированный рабочий стол (Xvfb на Linux)
    wait: 300